<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCADE CODEBREAKER</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuente Retro de Google Fonts -->
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- CDN Oficial de Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="arcade-container">
    <header class="arcade-header">
      <h1 class="neon-text-green">⚡ CODEBREAKER ⚡</h1>
      <button id="btn-salir" class="btn btn-red">❌ SALIR / MENÚ</button>
    </header>

    <!-- PANTALLA 1: MENÚ PRINCIPAL -->
    <div id="pantalla-menu" class="pantalla active">
      <h2 class="neon-text-magenta">SELECCIONA MODO</h2>
      <button id="btn-modo-pc" class="btn btn-neon">VS COMPUTADORA</button>
      <button id="btn-modo-multi" class="btn btn-neon">MULTIJUGADOR (REALTIME)</button>
    </div>

    <!-- PANTALLA 2: AJUSTES / DIFICULTAD -->
    <div id="pantalla-config" class="pantalla">
      <h2 class="neon-text-magenta">CONFIGURACIÓN</h2>
      <label>DIFICULTAD:</label>
      <select id="select-dificultad" class="arcade-input">
        <option value="3">FÁCIL (3 ELEMENTOS)</option>
        <option value="4" selected>MEDIA (4 ELEMENTOS)</option>
        <option value="5">DIFÍCIL (5 ELEMENTOS)</option>
        <option value="custom">PERSONALIZADA</option>
      </select>
      
      <div id="wrapper-custom" class="oculto">
        <label>LONGITUD (3-8):</label>
        <input type="number" id="input-custom-long" class="arcade-input" min="3" max="8" value="4">
      </div>

      <div id="wrapper-multi-sala" class="oculto">
        <label>TU NOMBRE:</label>
        <input type="text" id="input-nombre" class="arcade-input" placeholder="PLAYER 1">
        <label>CÓDIGO DE SALA (Para unirse o crear):</label>
        <input type="text" id="input-sala-id" class="arcade-input" placeholder="SALAXYZ">
      </div>

      <button id="btn-iniciar-juego" class="btn btn-green">🕹️ EMPEZAR</button>
    </div>

    <!-- PANTALLA 3: TABLERO DE JUEGO -->
    <div id="pantalla-juego" class="pantalla">
      <!-- Indicador de Turno LED -->
      <div id="indicador-turno" class="led-banner">
        >> ESPERANDO JUGADORES <<
      </div>

      <div class="juego-grid">
        <!-- Panel de Ataque -->
        <div class="panel-interaccion">
          <div id="seccion-definir-codigo">
            <h3 class="neon-text-green">CONFIGURA TU CÓDIGO SECRETO</h3>
            <p>Elementos disponibles: 0-9 y ★, ▲, ■, ●, ◆, ▼</p>
            <input type="text" id="input-mi-codigo" class="arcade-input" placeholder="Ej: 1,A,★,4">
            <button id="btn-guardar-codigo" class="btn btn-neon">GUARDAR</button>
          </div>

          <div id="seccion-combate" class="oculto">
            <h3 class="neon-text-magenta">ENTREGA TU HIPÓTESIS</h3>
            <label>SELECCIONA VÍCTIMA:</label>
            <select id="select-objetivo" class="arcade-input"></select>

            <label>TU APUESTA:</label>
            <input type="text" id="input-ataque" class="arcade-input" placeholder="Tu hipótesis">
            <button id="btn-enviar-ataque" class="btn btn-green">💥 ENVIAR ATAQUE</button>
          </div>
        </div>

        <!-- Historial Tipo Terminal -->
        <div class="panel-historial">
          <h3 class="neon-text-green">>_ HISTORIAL DE INTENTOS</h3>
          <div id="log-terminal" class="terminal-box">
            <p class="system-msg">[SISTEMA] Consola iniciada correctamente...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
